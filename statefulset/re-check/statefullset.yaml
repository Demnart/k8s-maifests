apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-statefulset
  namespace: work
  labels:
    kubernetes.io/name: &name test-statefulset
    kubernetes.io/version: &version v0.0.1
spec:
  podManagementPolicy: Parallel
  replicas: 3
  selector:
    matchLabels:
      kubernetes.io/name: *name
      kubernetes.io/version: *version
  serviceName: "test-statefulset-application"
  template:
    metadata:
      labels:
        kubernetes.io/name: *name
        kubernetes.io/version: *version
    spec:
      containers:
      - name: whoami
        image: traefik/whoami:latest
        ports:
        - containerPort: 80
          name: web
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
---
kind: Service
apiVersion: v1
metadata:
  name: test-statefulset-application
  namespace: work
  labels:
    kubernetes.io/name: &name test-statefulset
    kubernetes.io/version: &version v0.0.1
spec:
  clusterIP: None
  selector:
    kubernetes.io/name: *name
    kubernetes.io/version: *version
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
---
kind: Service
apiVersion: v1
metadata:
  name: test-statefulset-service
  namespace: work
  labels:
    kubernetes.io/name: &name test-statefulset
    kubernetes.io/version: &version v0.0.1
spec:
  selector:
    kubernetes.io/name: *name
    kubernetes.io/version: *version
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
