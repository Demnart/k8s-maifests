apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  namespace: work
  labels:
    kubernetes.io/name: &name myapp-deployment
    kubernetes.io/version: &version v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: *name
      version: *version
  template:
    metadata:
      labels:
        app: *name
        version: *version
    spec:
      containers:
      - name: busybox
        image: busybox:1.38
        command: ["sh", "-c", "tail -f /dev/null"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        volumeMounts:
        - name: config-volume
          mountPath: /etc/subfile.txt
          subPath: file1.txt
      volumes:
      - name: config-volume
        configMap:
          name: app-config