apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  namespace: work
  labels:
    kubernetes.io/name: &name myapp-deployment
    kubernetes.io/version: &version v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: *name
      version: *version
  template:
    metadata:
      labels:
        app: *name
        version: *version
    spec:
      containers:
      - name: nginx
        image: busybox:1.38
        command: ["sh", "-c", "tail -f /dev/null"]
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        env:
        - name: TEST_ENV1
          value: "test"
        - name: TEST_ENV2
          value: "test2"
        - name: TEST_APP_ENV"
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: TEST_APP_ENV
        - name: TEST_LOG_LEVEL_CURRENT
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: TEST_LOG_LEVEL
