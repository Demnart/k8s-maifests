apiVersion: v1
kind: Pod
metadata:
  name: &name my-first-pod
  namespace: work
  labels:
    app.kubernetes.io/name: *name
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "250m"
    ports:
      - containerPort: 80
