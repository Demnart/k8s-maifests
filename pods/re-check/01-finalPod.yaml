apiVersion: v1
kind: Pod
metadata:
  name: &name my-first-pod
  namespace: work
  labels:
    app.kubernetes.io/name: *name
    app.kubernetes.io/version: 1.31.6
spec:
  containers:
  - name: nginx-container
    image: nginx:1.31.6
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
      requests:
        memory: "64Mi"
        cpu: "250m"
    ports:
      - containerPort: 80
    livenessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1
    readinessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 1