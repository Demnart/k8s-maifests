apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: system-utils
  source:
    repoURL: 'https://github.com/Demnart/k8s-maifests'
    path: argocd/re-check/clusterapps/gateway
    targetRevision: HEAD
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      enabled: true
    syncOptions:
      - CreateNamespace=true