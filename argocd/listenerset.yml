---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: argocd-listenerset
  namespace: argocd
  annotations:
    # cert-manager (feature gate ListenerSets=true) выпустит сертификат для HTTPS-listener'ов
    cert-manager.io/cluster-issuer: "local-cluster-issuer"
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: cilium-gateway
    namespace: gateway
  listeners:
  - name: argocd-https
    protocol: HTTPS
    port: 443
    hostname: "argocd.local"
    allowedRoutes:
      namespaces:
        from: Same
    tls:
      mode: Terminate # Cilium (Envoy) сам расшифрует SSL трафик
      certificateRefs:
      - name: argocd-cluster-tls
  # hostname обязателен: без него listener конфликтует с listener'ом http:80 самого Gateway
  - name: argocd-http
    protocol: HTTP
    port: 80
    hostname: "argocd.local"
    allowedRoutes:
      namespaces:
        from: Same
