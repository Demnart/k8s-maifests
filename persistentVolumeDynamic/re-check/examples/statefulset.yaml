apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: web
  labels: &labels
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
spec:
  selector:
    matchLabels: *labels
  serviceName: nginx
  replicas: 2
  template:
    metadata:
      labels: *labels
    spec:
      containers:
      - name: app
        image: nginx:1.31
        command: ["/bin/sh", "-c"]
        args:
          - |
            #
            echo "Hostname: $(hostname)" > /usr/share/nginx/html/index.html;
            nginx -g 'daemon off;';
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "nfs-client"
      resources:
        requests:
          storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels: &labels
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
spec:
  clusterIP: None
  selector: *labels
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: service
  labels: &labels
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: test
    app.kubernetes.io/version: v0.0.1
spec:
  selector: *labels
  ports:
  - port: 80
    targetPort: 80

