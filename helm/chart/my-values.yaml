fullnameOverride: "art"

application:
  reloader: true
  podAnnotations: {}
  imagePullSecrets:
  - name: MySecret
  probes:
    livenessProbe:
      httpGet:
        path: /index.html
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3  
    readinessProbe:
      httpGet:
        path: /index.html
        port: http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 3
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi
  volumeMounts:
    - name: html
      mountPath: /usr/local/openresty/nginx/html
    - name: conf
      mountPath: /etc/nginx/conf.d
  volumes:
    - name: html
      configMapSuffix: html
    - name: conf
      configMapSuffix: conf