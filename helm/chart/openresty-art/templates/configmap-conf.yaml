---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openresty-art.fullname" . }}-conf
  labels:
    {{- include "openresty-art.labels" . | nindent 4 }}
data:
  default.conf: |-
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/local/openresty/nginx/html;
            index index.html index.htm;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/local/openresty/nginx/html;
        }
    }
