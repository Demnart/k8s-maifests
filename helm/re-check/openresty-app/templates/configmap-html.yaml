---
kind: ConfigMap
apiVersion: v1
metadata:
  name: {{ include "openresty-app.fullname" . }}-html
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "openresty-app.labels" . | nindent 4 }}
data:
{{- range $name, $value := .Values.html }}
  {{ $name }}.html: |
{{ $value | indent 4 }}
{{- end }}