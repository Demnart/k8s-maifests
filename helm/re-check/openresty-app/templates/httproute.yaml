{{- if .Values.httpRoute.enabled -}}
{{- $fullName := include "openresty-app.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
{{- $svcName := printf "%s-%s" $fullName "service" -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "openresty-app.fullname" . }}-httproute
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
  {{- with .Values.httpRoute.parentRefs }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ $svcName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
