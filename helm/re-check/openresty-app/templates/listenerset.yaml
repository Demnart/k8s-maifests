{{- if .Values.listenerSet.enabled -}}
{{- $fullName := include "openresty-app.fullname" . -}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "openresty-app.fullname" . }}-listenerset
  namespace: {{ .Release.Namespace }}
  {{- with .Values.listenerSet.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRef:
  {{- with .Values.listenerSet.parentRef }}
    {{- toYaml . | nindent 4 }}
  {{- end }}
  listeners:
  {{- range .Values.listenerSet.listeners }}
  - name: {{ .name }}
    protocol: {{ .protocol }}
    port: {{ .port }}
    hostname: {{ .hostname }}
    allowedRoutes:
      namespaces:
        from: {{ .allowedRoutes.namespaces.from }}
    {{- with .tls }}
    tls:
      mode: {{ .mode }}
      {{- with .certificateRefs }}
      certificateRefs:
      {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}