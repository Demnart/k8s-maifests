kind: DaemonSet
apiVersion: apps/v1
metadata:
  name: test-daemonset
  labels:
    kubernetes.io/name: &name daemonset-recheck
    kubernetes.io/version: &version v0.0.1
spec:
  selector:
    matchLabels:
      kubernetes.io/name: *name
      kubernetes.io/version: *version
  template:
    metadata:
      labels:
        kubernetes.io/name: *name
        kubernetes.io/version: *version
    spec:
      tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: whoami
        image: traefik/whoami:latest
        ports:
        - containerPort: 80
          name: web
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        