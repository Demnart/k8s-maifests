apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-deployment
  namespace: work
  labels:
    kubernetes.io/name: &name nginx
    kubernetes.io/version: &version 1.31.5
spec:
  replicas: 3
  selector:
    matchLabels:
      kubernetes.io/name: *name
      kubernetes.io/version: *version
  template:
    metadata:
      labels:
        kubernetes.io/name: *name
        kubernetes.io/version: *version
    spec:
      containers:
      - name: nginx
        image: nginx:1.31.5
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 80
        livenessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
