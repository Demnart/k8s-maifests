kind: Service
apiVersion: v1
metadata:
  name: openresty
  namespace: work
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    k8s-app: openresty
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: openresty
  namespace: work
  labels:
    k8s-app: openresty
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      k8s-app: openresty
  template:
    metadata:
      labels:
        k8s-app: openresty
    spec:
      initContainers:
        - name: prepare
          image: busybox:1.38.0
          imagePullPolicy: "IfNotPresent"
          envFrom:
            - secretRef:
                name: vault-secret
          command:
            - sh
            - -c
            - |
              sed -e "s/\$APPLICATION_FROM_VAULT/$APP_NAME/" \
                  -e "s/\$USER_FROM_VAULT/$APP_USER/" \
                  -e "s/\$PASSWORD_FROM_VAULT/$APP_PASSWORD/" \
                  /mnt-template/index.html > /mnt/index.html
              echo "Done"
          volumeMounts:
            - name: config
              mountPath: "/mnt"
            - name: config-template
              mountPath: "/mnt-template"
      containers:
        - name: openresty
          image: openresty/openresty:1.27.1.2-13-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /index.html
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            limits:
              cpu: "0.2"
              memory: "400Mi"
            requests:
              cpu: "0.1"
              memory: "200Mi"
          volumeMounts:
            - name: config
              mountPath: /usr/local/openresty/nginx/html/
      volumes:
        - name: config-template
          configMap:
            name: openresty
        - name: config
          emptyDir:
            medium: Memory
