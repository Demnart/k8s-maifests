apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-secret
  namespace: work
spec:
  refreshInterval: "180s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-secret
  dataFrom:
    - extract:
        key: "kubernetes/test/env-secret"